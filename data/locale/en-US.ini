Dialog.NoteCanvas="Another canvas has its own resolution, so this destination always uses its own encoder. Canvases that Aitum Stream Suite creates exist a few seconds after OBS starts; if the canvas is missing at start the destination reports it and keeps retrying."
Dialog.NoteFollow="Follow mode: Aitum's output settings replace these video and audio settings at every start. These values are only used if Aitum's file cannot be read."
